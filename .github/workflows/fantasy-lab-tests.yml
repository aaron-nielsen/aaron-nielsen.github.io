name: Fantasy Lab model checks

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'fantasy-preview/**'
      - '.github/workflows/fantasy-lab-tests.yml'
  pull_request:
    paths:
      - 'fantasy-preview/**'
      - '.github/workflows/fantasy-lab-tests.yml'

permissions:
  contents: read

jobs:
  forecasts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fantasy K/DST models and nine-starter lineups
        run: |
          node fantasy-preview/tests/special-teams.test.cjs
          node fantasy-preview/tests/availability-sanity.test.cjs
          node fantasy-preview/tests/overview-roster.test.cjs
          node fantasy-preview/tests/return-outlook.test.cjs
          node fantasy-preview/tests/roster-advice.test.cjs
          node fantasy-preview/tests/trade-preferences.test.cjs
          node fantasy-preview/tests/trade-leagues.test.cjs
          node fantasy-preview/tests/forecast-accuracy.test.cjs
          node fantasy-preview/tests/model-performance.test.cjs
          node fantasy-preview/tests/forecast-pipeline.test.cjs
          node fantasy-preview/tests/archived-forecasts.test.cjs
          node fantasy-preview/tests/transaction-grades.test.cjs
          node fantasy-preview/tests/playing-time.test.cjs
          node fantasy-preview/tests/usage-history.test.cjs
          node fantasy-preview/tests/transactions.test.cjs
          node fantasy-preview/tests/historical-lineups.test.cjs
          node fantasy-preview/tests/historical-trends.test.cjs
