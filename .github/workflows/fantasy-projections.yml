name: Fantasy model draft tests and build

on:
  workflow_dispatch:
  push:
    branches:
      - fantasy-dashboard-prototype-2026-10-09
    paths:
      - '.github/workflows/fantasy-projections.yml'
      - 'fantasy-dashboard/model/**'
      - 'fantasy-dashboard/tests/**'
      - 'fantasy-dashboard/data/rosters.json'
      - 'fantasy-dashboard/data/available.json'
      - 'fantasy-dashboard/data/league.json'

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check projection engine
        run: |
          cd fantasy-dashboard
          python -m unittest discover -s tests -v
      - name: Download NFL stats and generate provisional projections
        run: |
          cd fantasy-dashboard
          python model/build.py
      - name: Generate future-week scenario forecasts
        run: |
          cd fantasy-dashboard
          python model/future.py
      - name: Calculate lineup-aware free agent recommendations
        run: |
          cd fantasy-dashboard
          python model/waivers.py
      - name: Calculate multi-player trade packages
        run: |
          cd fantasy-dashboard
          python model/trades.py
      - name: Backtest on 2025 player-weeks
        run: |
          cd fantasy-dashboard
          python model/backtest.py
      - name: Commit model and validation output to this development branch
        run: |
          if git diff --quiet -- fantasy-dashboard/data/projections.json fantasy-dashboard/data/backtest.json fantasy-dashboard/data/weekly.json fantasy-dashboard/data/future.json fantasy-dashboard/data/waivers.json fantasy-dashboard/data/trades.json && git ls-files --error-unmatch fantasy-dashboard/data/projections.json >/dev/null 2>&1 && git ls-files --error-unmatch fantasy-dashboard/data/backtest.json >/dev/null 2>&1; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fantasy-dashboard/data/projections.json fantasy-dashboard/data/backtest.json fantasy-dashboard/data/weekly.json fantasy-dashboard/data/future.json fantasy-dashboard/data/waivers.json fantasy-dashboard/data/trades.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update provisional fantasy projections from nflverse'
            git push
          fi
