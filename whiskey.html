---
layout: whiskey
title: Aaron's Whiskey Ratings
permalink: /whiskey/
noindex: true
notranslate: true
nocache: true
---

<style>
:root{
  --bg:#12100f;
  --panel:#1b1816;
  --panel2:#251a14;
  --line:#5b3926;
  --text:#f5f0eb;
  --muted:#b9ada4;
  --green:#c6672f;
  --green2:#e08a4d;
  --amber:#c6672f;
  --amber2:#e5a064;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter",system-ui,-apple-system,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
.whiskey-app{max-width:1180px;margin:0 auto;padding:24px 22px 56px}

.hero{
  width:100%;
  border:1px solid #633d27;
  border-radius:16px;
  margin-bottom:16px;
  overflow:hidden;
  background:#171310;
  box-shadow:0 16px 45px rgba(0,0,0,.20);
}
.hero img{
  display:block;
  width:100%;
  height:auto;
}

.stats-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 16px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.stat-value{font-size:1.45rem;font-weight:700;color:#f5f8f6;line-height:1.1}
.stat-label{font-size:.78rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}

.nav-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.nav-row button{background:transparent;color:#e8ddd2;border:1px solid #6a4a31;border-radius:999px;padding:7px 14px;cursor:pointer}
.nav-row button:hover{border-color:var(--green2)}
.nav-row button.active{background:var(--green);border-color:var(--green);color:#0e1710;font-weight:700}

.whiskey-controls{display:grid;grid-template-columns:minmax(220px,2fr) minmax(120px,.75fr) minmax(145px,1fr) minmax(145px,1fr) 74px;gap:8px;margin:0 0 14px;align-items:stretch;width:100%;box-sizing:border-box}
.view-note{margin:4px 0 12px;color:var(--muted);font-size:.9rem}
.whiskey-controls input,.whiskey-controls select{width:100%;min-width:0;box-sizing:border-box;background:#181411;color:var(--text);border:1px solid #5a3f2b;border-radius:9px;padding:9px 11px}
.whiskey-controls .clear-filters{width:100%;box-sizing:border-box;background:#251a14;color:var(--text);border:1px solid #6a4a31;border-radius:9px;padding:9px 10px;cursor:pointer;white-space:nowrap}
.whiskey-controls .clear-filters:hover{border-color:var(--green2);color:#fff}
.whiskey-panel{display:none}
.whiskey-panel.active{display:block}

.main-section,.chart-section{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);margin:0 0 18px}
.main-section h2,.chart-section h2{font-size:1.18rem;font-weight:650;margin:0;padding:13px 16px;background:var(--panel2);border-left:4px solid var(--green)}
.main-section .whiskey-table-wrap{border:0;border-radius:0}

.whiskey-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.whiskey-table{width:100%;border-collapse:collapse;margin:0;min-width:680px}
.main-section .whiskey-table{min-width:620px}
.whiskey-table th,.whiskey-table td{padding:10px 12px;border-bottom:1px solid #3f2c20;text-align:left;vertical-align:middle}
.whiskey-table tr:last-child td{border-bottom:0}
.whiskey-table th{background:#251a14;color:#f5eee7;white-space:nowrap;font-weight:650}
.whiskey-table th.sortable{cursor:pointer;user-select:none}
.whiskey-table th.sortable:hover{background:#302019}
.whiskey-table th.active-sort{box-shadow:inset 0 -2px 0 var(--green2)}
.whiskey-table td.num,.whiskey-table th.num{text-align:center;font-variant-numeric:tabular-nums}
.whiskey-table tr:hover td{background:#211815}
.detail-table{table-layout:fixed;min-width:0}
.detail-table th,.detail-table td{padding:9px 9px}
.detail-table th:nth-child(1),.detail-table td:nth-child(1){width:31%}
.detail-table th:nth-child(2),.detail-table td:nth-child(2){width:14%}
.detail-table th:nth-child(3),.detail-table td:nth-child(3){width:15%}
.detail-table th:nth-child(4),.detail-table td:nth-child(4){width:22%}
.detail-table th:nth-child(5),.detail-table td:nth-child(5){width:5%}
.detail-table th:nth-child(6),.detail-table td:nth-child(6){width:7%}
.detail-table th:nth-child(7),.detail-table td:nth-child(7){width:6%}
.detail-table td:nth-child(1),.detail-table td:nth-child(4){overflow-wrap:anywhere}
.detail-table td:nth-child(2),.detail-table td:nth-child(3){overflow-wrap:break-word}
.whiskey-name{color:#f3ebe3;text-decoration:none;cursor:pointer;background:none;border:0;padding:0;font:inherit;text-align:left}
.whiskey-name:hover{color:var(--green2)}
.filter-link{color:#f3ebe3;text-decoration:none;cursor:pointer;background:none;border:0;padding:0;font:inherit;text-align:left}
.filter-link:hover{color:var(--green2)}

.chart-body{padding:14px 16px 16px}
.bar-row{display:grid;grid-template-columns:minmax(150px,230px) 1fr 128px;gap:12px;align-items:center;margin:9px 0}
.bar-label{color:#efe5db;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:14px;background:#2c211a;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green2));border-radius:999px;min-width:2px}
.bar-value{text-align:right;color:#e5d8cc;font-variant-numeric:tabular-nums;font-size:.9rem}
.bar-value .pct-range{color:var(--muted);font-size:.78rem;margin-left:5px}
.distribution-chart{max-width:none;width:auto;padding:10px 12px 14px}
.distribution-chart .bar-row,.distribution-chart .distribution-head{grid-template-columns:76px 36px 42px minmax(280px,1fr) 32px;justify-content:stretch;gap:7px}
.distribution-chart .bar-row{margin:6px 0}
.distribution-chart .distribution-head{display:grid;align-items:end;margin:0 0 4px;color:var(--muted);font-size:.72rem;font-weight:650;text-transform:uppercase;letter-spacing:.04em}
.distribution-chart .distribution-head span{text-align:right}
.distribution-chart .dist-name{color:var(--amber2);font-size:.78rem;text-align:right;white-space:nowrap}
.distribution-chart .dist-percentile{color:var(--muted);font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.distribution-chart .dist-rating{color:#efe5db;text-align:right;font-variant-numeric:tabular-nums;padding-right:6px}
.distribution-chart .bar-value{text-align:right}
.distillery-chart .bar-row{grid-template-columns:minmax(170px,230px) minmax(180px,1fr) 180px}
.distillery-chart .bar-label{white-space:normal;overflow:visible}
.distillery-chart .bar-value{white-space:nowrap}
.chart-note{padding:5px 0 0;color:var(--muted);font-size:.78rem}
.substyle-chart .bar-row{grid-template-columns:minmax(250px,34%) minmax(140px,1fr) 44px}
.substyle-chart .bar-label{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.2}
.substyle-more{padding:0 16px 15px}
.substyle-more button{background:transparent;color:#eadfd4;border:1px solid #6a4a31;border-radius:999px;padding:6px 11px;cursor:pointer}
.substyle-more button:hover{border-color:var(--green2)}

dialog.whiskey-dialog{background:#171310;color:var(--text);border:1px solid #65472f;border-radius:12px;max-width:650px;width:92%}
dialog.whiskey-dialog::backdrop{background:rgba(0,0,0,.7)}
.whiskey-dialog button.close{float:right;background:#251a14;color:#fff;border:1px solid #6a4a31;border-radius:6px;padding:6px 10px;cursor:pointer}
.earlier-ratings{margin:12px 0 2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--muted);font-size:.9rem}
.earlier-ratings strong{color:var(--text);font-weight:600}
.history-undated{margin:10px 2px 0;color:var(--muted);font-size:.9rem}
.history-table{table-layout:fixed;min-width:0}
.history-table th,.history-table td{padding:9px 8px}
.history-table th:nth-child(1),.history-table td:nth-child(1){width:15%}
.history-table th:nth-child(2),.history-table td:nth-child(2){width:31%;overflow-wrap:anywhere}
.history-table th:nth-child(3),.history-table td:nth-child(3){width:8%}
.history-table th:nth-child(4),.history-table td:nth-child(4){width:12%}
.history-table th:nth-child(5),.history-table td:nth-child(5){width:15%;overflow-wrap:anywhere}
.history-table th:nth-child(6),.history-table td:nth-child(6){width:19%;overflow-wrap:anywhere}
.whiskey-history-list{width:100%;border-collapse:collapse}
.whiskey-history-list td,.whiskey-history-list th{border-bottom:1px solid #4a3425;padding:8px}
.whiskey-history-list th:first-child,.whiskey-history-list td:first-child,
.whiskey-history-list th:last-child,.whiskey-history-list td:last-child{text-align:center}

@media(max-width:800px){
  .stats-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail-table{table-layout:auto;min-width:760px}
  .detail-table th:nth-child(n),.detail-table td:nth-child(n){width:auto}
}
@media(max-width:700px){
  .history-table{table-layout:auto;min-width:760px}
  .history-table th:nth-child(n),.history-table td:nth-child(n){width:auto}
}
@media(max-width:620px){
  .whiskey-app{padding:14px 10px 36px}
  .stats-row{gap:8px}
  .stat-card{padding:11px}
  .stat-value{font-size:1.25rem}
  .nav-row{gap:6px}
  .nav-row button{padding:6px 10px}
  .whiskey-controls{grid-template-columns:1fr}
  .whiskey-controls .clear-filters{width:100%}
  .bar-row{grid-template-columns:105px 1fr 90px;gap:8px}
  .distillery-chart .bar-row{grid-template-columns:150px minmax(120px,1fr) 128px}
  .substyle-chart .bar-row{grid-template-columns:minmax(170px,45%) 1fr 34px}
  .distribution-chart{max-width:none}
  .distribution-chart .bar-row,.distribution-chart .distribution-head{grid-template-columns:68px 30px 38px minmax(120px,1fr) 28px;gap:5px}
  .distribution-chart .bar-row{margin:5px 0}
}
@media(max-width:460px){
  .distribution-chart .bar-row,.distribution-chart .distribution-head{grid-template-columns:58px 28px 36px minmax(86px,1fr) 26px;gap:4px}
  .distribution-chart .dist-name{font-size:.72rem}
  .distribution-chart .dist-percentile{font-size:.76rem}
}
</style>

<script>
(function(){
  var DATA_URL="/data/whiskey_ratings.json?v="+Date.now();
  var data=null,rows=[],activeTab="main",substyleExpanded=false,topExpanded=false;
  var sortState={
    all:{key:"average",dir:-1},
    "need-more":{key:"average",dir:-1},
    history:{key:"date",dir:-1}
  };
  var mainSort={
    recent:{key:"date",dir:-1},
    top:{key:"average",dir:-1}
  };

  function avg(xs){return xs.reduce(function(a,b){return a+b},0)/xs.length}
  function fmt(x){return Number(x).toFixed(2)}
  function whiskeyGradient(i,n){
    var t=n<=1?0.45:i/(n-1);
    var h1=Math.round(38-16*t),h2=Math.max(18,h1-4);
    var l1=Math.round(60-17*t),l2=Math.round(68-18*t);
    return "linear-gradient(90deg,hsl("+h1+",68%,"+l1+"%),hsl("+h2+",72%,"+l2+"%))";
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]})}
  function pctRank(values,x){
    if(values.length<=1)return 100;
    var below=values.filter(function(v){return v<x-1e-12}).length;
    return Math.round(100*below/(values.length-1));
  }
  function prettyDate(s){
    if(!s)return "—";
    return new Date(s+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  }

  function computeRows(){
    rows=data.products.map(function(p){
      var scores=p.ratings.map(function(r){return r.score});
      return Object.assign({},p,{n:scores.length,average:avg(scores)});
    });
    var all=rows.map(function(r){return r.average});
    var qualified=rows.filter(function(r){return r.n>=3}).map(function(r){return r.average});
    var byStyle={};
    rows.forEach(function(r){(byStyle[r.style]||(byStyle[r.style]=[])).push(r.average)});
    rows=rows.map(function(r){
      return Object.assign({},r,{
        percentile:pctRank(all,r.average),
        qPercentile:r.n>=3?pctRank(qualified,r.average):null,
        sPercentile:pctRank(byStyle[r.style],r.average)
      });
    });
  }

  function setupFilters(){
    var regions=Array.from(new Set(rows.map(function(r){return r.region}))).sort();
    document.getElementById("region-filter").innerHTML='<option value="">All regions</option>'+
      regions.map(function(x){return '<option>'+esc(x)+'</option>'}).join("");
    updateStyles();
  }

  function updateStyles(){
    var region=document.getElementById("region-filter").value;
    var select=document.getElementById("style-filter");
    var current=select.value;
    var source=region?rows.filter(function(r){return r.region===region}):rows;
    var styles=Array.from(new Set(source.map(function(r){return r.style}))).sort();
    select.innerHTML='<option value="">All styles</option>'+
      styles.map(function(x){return '<option>'+esc(x)+'</option>'}).join("");
    select.value=styles.indexOf(current)>=0?current:"";
    updateSubstyles();
  }

  function updateSubstyles(){
    var region=document.getElementById("region-filter").value;
    var style=document.getElementById("style-filter").value;
    var select=document.getElementById("substyle-filter");
    var current=select.value;
    var source=rows.filter(function(r){
      return (!region||r.region===region)&&(!style||r.style===style);
    });
    var subs=Array.from(new Set(source.map(function(r){return r.substyle}).filter(Boolean))).sort();
    select.innerHTML='<option value="">All sub-styles</option>'+
      subs.map(function(x){return '<option>'+esc(x)+'</option>'}).join("");
    select.value=subs.indexOf(current)>=0?current:"";
  }

  function filtered(source){
    var q=document.getElementById("search").value.trim().toLowerCase();
    var region=document.getElementById("region-filter").value;
    var style=document.getElementById("style-filter").value;
    var sub=document.getElementById("substyle-filter").value;
    return source.filter(function(r){
      return (!q||(r.name+" "+r.region+" "+r.style+" "+(r.substyle||"")).toLowerCase().indexOf(q)>=0)&&
        (!region||r.region===region)&&(!style||r.style===style)&&
        (!sub||r.substyle===sub||(r.substyle&&r.substyle.indexOf(sub+" / ")===0));
    });
  }

  function compare(a,b,key,dir){
    var av=a[key],bv=b[key];
    if(av==null&&bv==null)return 0;
    if(av==null)return 1;
    if(bv==null)return -1;
    if(typeof av==="string"&&typeof bv==="string")return dir*av.localeCompare(bv);
    return dir*(av-bv);
  }
  function sorted(state,items){
    return items.slice().sort(function(a,b){return compare(a,b,state.key,state.dir)});
  }

  function th(tab,key,label,cls){
    var s=sortState[tab];
    var active=s&&s.key===key?" active-sort":"";
    return '<th class="sortable'+active+' '+(cls||"")+'" data-tab="'+tab+'" data-sort="'+key+'">'+
      label+'</th>';
  }
  function mth(section,key,label,cls){
    var s=mainSort[section];
    var active=s.key===key?" active-sort":"";
    return '<th class="sortable'+active+' '+(cls||"")+'" data-main-section="'+section+'" data-main-sort="'+key+'">'+
      label+'</th>';
  }

  function whiskeyTable(source,tab){
    var xs=sorted(sortState[tab],source);
    var pctKey=tab==="qualified"?"qPercentile":"percentile";
    var pctLabel="%ile";
    var html='<div class="whiskey-table-wrap"><table class="whiskey-table detail-table"><thead><tr>'+
      th(tab,"name","Whiskey")+th(tab,"region","Region")+th(tab,"style","Style")+th(tab,"substyle","Sub-style")+
      th(tab,"n","N","num")+th(tab,"average","Avg","num")+th(tab,pctKey,pctLabel,"num")+
      '</tr></thead><tbody>';
    xs.forEach(function(r){
      var pct=r[pctKey];
      html+='<tr>'+
        '<td><button class="whiskey-name" data-name="'+esc(r.name)+'">'+esc(r.name)+'</button></td>'+
        '<td><button class="filter-link region-link" data-region="'+esc(r.region)+'">'+esc(r.region)+'</button></td>'+
        '<td><button class="filter-link style-link" data-style="'+esc(r.style)+'">'+esc(r.style)+'</button></td>'+
        '<td>'+(r.substyle?'<button class="filter-link substyle-link" data-substyle="'+esc(r.substyle)+'">'+esc(r.substyle)+'</button>':'')+'</td>'+
        '<td class="num">'+r.n+'</td><td class="num">'+fmt(r.average)+'</td>'+
        '<td class="num">'+(pct==null?"—":pct)+'</td></tr>';
    });
    return html+'</tbody></table></div>';
  }

  function historyRows(){
    var out=[];
    rows.forEach(function(r){
      r.ratings.forEach(function(x){
        out.push({date:x.date||"",name:r.name,region:r.region,style:r.style,substyle:r.substyle,score:x.score});
      });
    });
    return out;
  }

  function historyTable(){
    var allHistory=historyRows();
    var dated=allHistory.filter(function(h){return h.date});
    var undated=allHistory.length-dated.length;
    var xs=sorted(sortState.history,dated);
    var html='<div class="whiskey-table-wrap"><table class="whiskey-table history-table"><thead><tr>'+
      th("history","date","Date")+th("history","name","Whiskey")+th("history","score","Rating","num")+
      th("history","region","Region")+th("history","style","Style")+th("history","substyle","Sub-style")+
      '</tr></thead><tbody>';
    xs.forEach(function(h){
      html+='<tr>'+
        '<td style="white-space:nowrap">'+prettyDate(h.date)+'</td>'+
        '<td><button class="whiskey-name" data-name="'+esc(h.name)+'">'+esc(h.name)+'</button></td>'+
        '<td class="num">'+h.score.toFixed(1)+'</td>'+
        '<td>'+esc(h.region)+'</td>'+
        '<td>'+esc(h.style)+'</td>'+
        '<td>'+esc(h.substyle||"")+'</td>'+
        '</tr>';
    });
    html+='</tbody></table></div>';
    if(undated){
      html+='<p class="history-undated">'+undated+' earlier rating'+(undated===1?' has':'s have')+' unknown date'+(undated===1?'':'s')+'.</p>';
    }
    return html;
  }

  function styleRows(){
    var groups={};
    rows.forEach(function(r){(groups[r.style]||(groups[r.style]=[])).push(r)});
    return Object.keys(groups).map(function(name){
      var rs=groups[name];
      return {name:name,whiskeys:rs.length,average:avg(rs.map(function(r){return r.average}))};
    });
  }

  function substyleRows(){
    var groups={};
    rows.forEach(function(r){
      if(!r.substyle)return;
      var full=r.substyle;
      var parent=full.split(" / ")[0];
      (groups[parent]||(groups[parent]=[])).push(r);
      if(full!==parent)(groups[full]||(groups[full]=[])).push(r);
    });
    return Object.keys(groups).map(function(name){
      var rs=groups[name];
      return {name:name,whiskeys:rs.length,average:avg(rs.map(function(r){return r.average}))};
    }).sort(function(a,b){return b.whiskeys-a.whiskeys||a.name.localeCompare(b.name)});
  }

  function mainRecent(){
    var xs=sorted(mainSort.recent,historyRows().filter(function(h){return h.date})).slice(0,10);
    var html='<div class="whiskey-table-wrap"><table class="whiskey-table"><thead><tr>'+
      mth("recent","date","Date")+mth("recent","name","Whiskey")+mth("recent","score","Rating","num")+mth("recent","region","Region")+mth("recent","style","Style")+
      '</tr></thead><tbody>';
    xs.forEach(function(h){
      html+='<tr><td style="white-space:nowrap">'+prettyDate(h.date)+'</td>'+
        '<td><button class="whiskey-name" data-name="'+esc(h.name)+'">'+esc(h.name)+'</button></td>'+
        '<td class="num">'+h.score.toFixed(1)+'</td><td>'+esc(h.region)+'</td><td>'+esc(h.style)+'</td></tr>';
    });
    return html+'</tbody></table></div>';
  }

  function mainTopRated(){
    var source=rows.filter(function(r){return r.n>=3});
    var rankOrder=source.slice().sort(function(a,b){return b.average-a.average||a.name.localeCompare(b.name)});
    var rankMap={},lastAvg=null,currentRank=0;
    rankOrder.forEach(function(r,i){
      if(lastAvg===null||r.average<lastAvg-1e-12){currentRank=i+1;lastAvg=r.average}
      rankMap[r.name]=currentRank;
    });
    var sortedSource=sorted(mainSort.top,source);
    var xs=topExpanded?sortedSource:sortedSource.slice(0,10);
    var html='<div class="whiskey-table-wrap"><table class="whiskey-table"><thead><tr>'+
      '<th class="num">#</th>'+mth("top","name","Whiskey")+mth("top","average","Avg","num")+mth("top","n","N","num")+
      mth("top","qPercentile","%ile","num")+mth("top","region","Region")+mth("top","style","Style")+
      '</tr></thead><tbody>';
    xs.forEach(function(r){
      html+='<tr><td class="num">'+rankMap[r.name]+'</td><td><button class="whiskey-name" data-name="'+esc(r.name)+'">'+esc(r.name)+'</button></td>'+
        '<td class="num">'+fmt(r.average)+'</td><td class="num">'+r.n+'</td>'+
        '<td class="num">'+r.qPercentile+'</td><td>'+esc(r.region)+'</td><td>'+esc(r.style)+'</td></tr>';
    });
    html+='</tbody></table></div>';
    if(source.length>10){
      html+='<div class="substyle-more"><button type="button" id="top-toggle">'+
        (topExpanded?"Show top 10":"Show all "+source.length)+'</button></div>';
    }
    return html;
  }

  function mainStyles(){
    var xs=sorted(mainSort.styles,styleRows());
    var html='<div class="whiskey-table-wrap"><table class="whiskey-table"><thead><tr>'+
      mth("styles","name","Style")+mth("styles","whiskeys","Whiskeys","num")+mth("styles","average","Avg","num")+
      '</tr></thead><tbody>';
    xs.forEach(function(s){
      html+='<tr><td><button class="filter-link style-link" data-style="'+esc(s.name)+'">'+esc(s.name)+'</button></td>'+
        '<td class="num">'+s.whiskeys+'</td><td class="num">'+fmt(s.average)+'</td></tr>';
    });
    return html+'</tbody></table></div>';
  }

  function mainMostRated(){
    var xs=sorted(mainSort.most,rows).slice(0,10);
    var html='<div class="whiskey-table-wrap"><table class="whiskey-table"><thead><tr>'+
      mth("most","name","Whiskey")+mth("most","n","N","num")+mth("most","average","Avg","num")+mth("most","region","Region")+mth("most","style","Style")+
      '</tr></thead><tbody>';
    xs.forEach(function(r){
      html+='<tr><td><button class="whiskey-name" data-name="'+esc(r.name)+'">'+esc(r.name)+'</button></td>'+
        '<td class="num">'+r.n+'</td><td class="num">'+fmt(r.average)+'</td><td>'+esc(r.region)+'</td><td>'+esc(r.style)+'</td></tr>';
    });
    return html+'</tbody></table></div>';
  }

  function barChart(items,labelKey,valueKey){
    var max=Math.max.apply(null,items.map(function(x){return x[valueKey]}));
    return '<div class="chart-body">'+items.map(function(x,i){
      var w=max?100*x[valueKey]/max:0;
      return '<div class="bar-row"><div class="bar-label" title="'+esc(x[labelKey])+'">'+
        '<button class="filter-link style-link" data-style="'+esc(x[labelKey])+'">'+esc(x[labelKey])+'</button></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+w.toFixed(1)+'%;background:'+whiskeyGradient(i,items.length)+'"></div></div>'+
        '<div class="bar-value">'+x[valueKey]+'</div></div>';
    }).join("")+'</div>';
  }

  function substyleChart(items){
    var shown=substyleExpanded?items:items.slice(0,12);
    var max=Math.max.apply(null,items.map(function(x){return x.whiskeys}));
    var body='<div class="chart-body substyle-chart">'+shown.map(function(x,i){
      var w=max?100*x.whiskeys/max:0;
      return '<div class="bar-row"><div class="bar-label">'+
        '<button class="filter-link substyle-link" data-substyle="'+esc(x.name)+'">'+esc(x.name)+'</button></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+w.toFixed(1)+'%;background:'+whiskeyGradient(i,shown.length)+'"></div></div>'+
        '<div class="bar-value">'+x.whiskeys+'</div></div>';
    }).join("")+'</div>';
    if(items.length>12){
      body+='<div class="substyle-more"><button type="button" id="substyle-toggle">'+
        (substyleExpanded?"Show fewer":"Show all "+items.length+" sub-styles")+'</button></div>';
    }
    return body;
  }

  function distilleryName(name){
    if(/^(Basil Hayden|Booker's|Knob Creek)/.test(name))return "Jim Beam";
    if(/^(Bernheim|Elijah Craig|Evan Williams)/.test(name))return "Heaven Hill";
    if(/^(Russell's Reserve|Wild Turkey)/.test(name))return "Wild Turkey";
    if(/^Four Roses/.test(name))return "Four Roses";
    if(/^(Jack Daniel's|Gentleman Jack)/.test(name))return "Jack Daniel";
    if(/^(Buffalo Trace|Eagle Rare|Blanton's|Sazerac Rye)/.test(name))return "Buffalo Trace";
    if(/^The Glenlivet|^Glenlivet/.test(name))return "The Glenlivet";
    if(/^Glenmorangie/.test(name))return "Glenmorangie";
    if(/^Balvenie/.test(name))return "The Balvenie";
    if(/^High West/.test(name))return "High West";
    if(/^Maker's/.test(name))return "Maker's Mark";
    if(/^Woodford Reserve/.test(name))return "Woodford Reserve";
    if(/^Stranahan's/.test(name))return "Stranahan's";
    if(/^Angel's Envy/.test(name))return "Angel's Envy";
    if(/^Ardbeg/.test(name))return "Ardbeg";
    if(/^Laphroaig/.test(name))return "Laphroaig";
    if(/^Glenfiddich/.test(name))return "Glenfiddich";
    if(/^Aberlour/.test(name))return "Aberlour";
    if(/^Dalmore/.test(name))return "The Dalmore";
    if(/^Dalwhinnie/.test(name))return "Dalwhinnie";
    if(/^Highland Park/.test(name))return "Highland Park";
    if(/^Macallan/.test(name))return "The Macallan";
    if(/^Oban/.test(name))return "Oban";
    if(/^Talisker/.test(name))return "Talisker";
    if(/^Michter's/.test(name))return "Michter's";
    if(/^Port Chilkoot/.test(name))return "Port Chilkoot";
    if(/^Woody Creek/.test(name))return "Woody Creek";
    return "";
  }

  function distilleryRows(){
    var groups={};
    rows.forEach(function(r){
      var d=distilleryName(r.name);
      if(!d)return;
      if(!groups[d])groups[d]={name:d,ratings:0,whiskeys:0};
      groups[d].ratings+=r.n;
      groups[d].whiskeys+=1;
    });
    return Object.keys(groups).map(function(k){return groups[k]}).sort(function(a,b){
      return b.ratings-a.ratings||b.whiskeys-a.whiskeys||a.name.localeCompare(b.name);
    });
  }

  function distilleryChart(items){
    var shown=items.slice(0,10);
    var max=Math.max.apply(null,shown.map(function(x){return x.ratings}));
    return '<div class="chart-body distillery-chart">'+shown.map(function(x,i){
      var w=max?100*x.ratings/max:0;
      return '<div class="bar-row"><div class="bar-label">'+(i+1)+'. '+esc(x.name)+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+w.toFixed(1)+'%;background:'+whiskeyGradient(i,shown.length)+'"></div></div>'+
        '<div class="bar-value">'+x.ratings+' ratings <span class="pct-range">· '+x.whiskeys+' whiskeys</span></div></div>';
    }).join('')+
      '<div class="chart-note">Grouped by producing distillery where clear; sourced or blended brands are omitted.</div></div>';
  }

  function ratingDistribution(){
    var ratingNames={
      50:"Masterpiece",
      45:"Excellent",
      40:"Very Good",
      35:"Good",
      30:"Fine",
      25:"Meh",
      20:"Poor",
      15:"Bad",
      10:"Terrible",
      5:"Awful"
    };
    var scores=[];
    rows.forEach(function(r){r.ratings.forEach(function(x){scores.push(Math.round(x.score*10))})});
    scores.sort(function(a,b){return a-b});
    var minScore=Math.min.apply(null,scores);
    var maxScore=Math.max.apply(null,scores);
    var total=scores.length;
    var bins=[];

    for(var score=maxScore;score>=minScore;score--){
      var below=scores.filter(function(s){return s<score}).length;
      var count=scores.filter(function(s){return s===score}).length;
      var medianPct=count
        ? Math.round(100*(below+(count-1)/2)/(total-1))
        : null;
      bins.push({
        score:score,
        label:(score/10).toFixed(1),
        count:count,
        percentile:medianPct
      });
    }

    var maxCount=Math.max.apply(null,bins.map(function(x){return x.count}));
    return '<div class="chart-body distribution-chart">'+
      '<div class="distribution-head"><span></span><span>%ile</span><span>Rating</span><span></span><span>N</span></div>'+
      bins.map(function(x,i){
      var w=maxCount?100*x.count/maxCount:0;
      return '<div class="bar-row">'+
        '<div class="dist-name">'+(ratingNames[x.score]||"")+'</div>'+
        '<div class="dist-percentile">'+(x.percentile==null?"":x.percentile)+'</div>'+
        '<div class="dist-rating">'+x.label+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+w.toFixed(1)+'%;background:'+whiskeyGradient(i,bins.length)+'"></div></div>'+
        '<div class="bar-value">'+x.count+'</div></div>';
    }).join("")+'</div>';
  }

  function renderMain(){
    document.getElementById("whiskey-controls").style.display="none";
    var styles=styleRows().sort(function(a,b){return b.whiskeys-a.whiskeys||a.name.localeCompare(b.name)});
    var substyles=substyleRows();
    document.getElementById("main").innerHTML=
      '<section class="main-section"><h2>Recent Ratings</h2>'+mainRecent()+'</section>'+
      '<section class="main-section"><h2>Top Rated Whiskeys</h2>'+mainTopRated()+'</section>'+
      '<section class="chart-section"><h2>Most Tasted Distilleries</h2>'+distilleryChart(distilleryRows())+'</section>'+
      '<section class="chart-section"><h2>Whiskeys by Style</h2>'+barChart(styles,"name","whiskeys")+'</section>'+
      '<section class="chart-section"><h2>Whiskeys by Sub-style</h2>'+substyleChart(substyles)+'</section>'+

      '<section class="chart-section"><h2>Rating Distribution</h2>'+ratingDistribution()+'</section>';
  }

  function render(){
    if(activeTab==="main"){
      renderMain();
    }else if(activeTab==="all"){
      document.getElementById("whiskey-controls").style.display="grid";
      document.getElementById("all").innerHTML=whiskeyTable(filtered(rows),"all");
    }else if(activeTab==="need-more"){
      document.getElementById("whiskey-controls").style.display="grid";
      document.getElementById("need-more").innerHTML=whiskeyTable(filtered(rows.filter(function(r){return r.n<3})),"need-more");
    }else if(activeTab==="history"){
      document.getElementById("whiskey-controls").style.display="none";
      document.getElementById("history").innerHTML=historyTable();
    }
    bindEvents();
  }

  function switchPrimary(tab){
    activeTab=tab;
    document.querySelectorAll("#primary-tabs button").forEach(function(b){
      b.classList.toggle("active",b.getAttribute("data-tab")===tab);
    });
    document.querySelectorAll(".whiskey-panel").forEach(function(p){
      p.classList.toggle("active",p.id===tab);
    });
    render();
  }

  function activateAll(){
    activeTab="all";
    document.querySelectorAll("#primary-tabs button").forEach(function(b){
      b.classList.toggle("active",b.getAttribute("data-tab")==="all");
    });
    document.querySelectorAll(".whiskey-panel").forEach(function(p){
      p.classList.toggle("active",p.id==="all");
    });
  }

  function drillRegion(region){
    activateAll();
    document.getElementById("search").value="";
    document.getElementById("region-filter").value=region;
    updateStyles();
    render();
  }

  function drillStyle(style){
    activateAll();
    document.getElementById("search").value="";
    document.getElementById("region-filter").value="";
    updateStyles();
    document.getElementById("style-filter").value=style;
    updateSubstyles();
    document.getElementById("substyle-filter").value="";
    render();
  }

  function drillSubstyle(substyle){
    activateAll();
    document.getElementById("search").value="";
    document.getElementById("region-filter").value="";
    updateStyles();
    document.getElementById("style-filter").value="";
    updateSubstyles();
    document.getElementById("substyle-filter").value=substyle;
    render();
  }

  function bindEvents(){
    document.querySelectorAll(".sortable[data-tab]").forEach(function(cell){
      cell.onclick=function(){
        var tab=cell.getAttribute("data-tab"),key=cell.getAttribute("data-sort"),s=sortState[tab];
        if(s.key===key)s.dir*=-1;
        else{s.key=key;s.dir=["name","style","substyle","date"].indexOf(key)>=0?1:-1}
        render();
      };
    });
    document.querySelectorAll(".sortable[data-main-section]").forEach(function(cell){
      cell.onclick=function(){
        var section=cell.getAttribute("data-main-section"),key=cell.getAttribute("data-main-sort"),s=mainSort[section];
        if(s.key===key)s.dir*=-1;
        else{s.key=key;s.dir=["name","style","date"].indexOf(key)>=0?1:-1}
        render();
      };
    });
    document.querySelectorAll(".whiskey-name").forEach(function(btn){
      btn.onclick=function(){showDetail(btn.getAttribute("data-name"))};
    });
    document.querySelectorAll(".region-link").forEach(function(btn){
      btn.onclick=function(){drillRegion(btn.getAttribute("data-region"))};
    });
    document.querySelectorAll(".style-link").forEach(function(btn){
      btn.onclick=function(){drillStyle(btn.getAttribute("data-style"))};
    });
    document.querySelectorAll(".substyle-link").forEach(function(btn){
      btn.onclick=function(){drillSubstyle(btn.getAttribute("data-substyle"))};
    });
    var topToggle=document.getElementById("top-toggle");
    if(topToggle)topToggle.onclick=function(){
      topExpanded=!topExpanded;
      render();
    };
    var subToggle=document.getElementById("substyle-toggle");
    if(subToggle)subToggle.onclick=function(){
      substyleExpanded=!substyleExpanded;
      render();
    };
  }

  function showDetail(name){
    var r=rows.find(function(x){return x.name===name});
    if(!r)return;

    var indexed=r.ratings.map(function(x,i){
      return {score:x.score,date:x.date||"",number:i+1};
    });
    var dated=indexed.filter(function(x){return x.date}).sort(function(a,b){
      return b.date.localeCompare(a.date)||b.number-a.number;
    });
    var undated=indexed.filter(function(x){return !x.date}).sort(function(a,b){
      return b.number-a.number;
    });

    var hist=dated.map(function(x){
      return '<tr><td>'+x.number+'</td><td>'+prettyDate(x.date)+'</td><td>'+x.score.toFixed(1)+'</td></tr>';
    }).join("");

    var undatedNote=undated.length
      ? '<div class="earlier-ratings"><strong>Earlier ratings (dates unknown):</strong> '+
        undated.map(function(x){return '#'+x.number+' '+x.score.toFixed(1)}).join(' · ')+'</div>'
      : '';

    var datedTable=dated.length
      ? '<table class="whiskey-history-list"><thead><tr><th>#</th><th>Date</th><th>Rating</th></tr></thead><tbody>'+hist+'</tbody></table>'
      : '';

    document.getElementById("dialog-content").innerHTML=
      '<h2>'+esc(r.name)+'</h2>'+
      '<p>'+esc(r.region)+' · '+esc(r.style)+(r.substyle?' · '+esc(r.substyle):'')+'</p>'+
      '<p><strong>Avg:</strong> '+fmt(r.average)+' / 5.0 &nbsp; <strong>N:</strong> '+r.n+
      ' &nbsp; <strong>%ile:</strong> '+r.percentile+
      ' &nbsp; <strong>Qualified %ile:</strong> '+(r.qPercentile==null?"—":r.qPercentile)+
      ' &nbsp; <strong>Style %ile:</strong> '+r.sPercentile+'</p>'+
      datedTable+undatedNote;
    document.getElementById("whiskey-dialog").showModal();
  }

  function init(){
    fetch(DATA_URL,{cache:"no-store"}).then(function(res){return res.json()}).then(function(json){
      data=json;
      computeRows();
      setupFilters();

      var totalRatings=rows.reduce(function(a,r){return a+r.n},0);
      var scores=[];
      rows.forEach(function(r){r.ratings.forEach(function(x){scores.push(x.score)})});
      document.getElementById("stat-whiskeys").textContent=rows.length;
      document.getElementById("stat-ratings").textContent=totalRatings;
      document.getElementById("stat-average").textContent=fmt(avg(scores));

      document.querySelectorAll("#primary-tabs button").forEach(function(btn){
        btn.onclick=function(){switchPrimary(btn.getAttribute("data-tab"))};
      });
      document.getElementById("search").addEventListener("input",render);
      document.getElementById("region-filter").addEventListener("change",function(){updateStyles();render()});
      document.getElementById("style-filter").addEventListener("change",function(){updateSubstyles();render()});
      document.getElementById("substyle-filter").addEventListener("change",render);
      document.getElementById("clear-filters").onclick=function(){
        document.getElementById("search").value="";
        document.getElementById("region-filter").value="";
        updateStyles();
        document.getElementById("style-filter").value="";
        updateSubstyles();
        document.getElementById("substyle-filter").value="";
        render();
      };
      var dialog=document.getElementById("whiskey-dialog");
      document.getElementById("dialog-close").onclick=function(){dialog.close()};
      dialog.addEventListener("click",function(e){
        var r=dialog.getBoundingClientRect();
        var inside=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
        if(!inside)dialog.close();
      });
      render();
    }).catch(function(err){
      document.getElementById("main").innerHTML="<p>Could not load whiskey data.</p>";
      console.error(err);
    });
  }
  init();
})();
</script>
