---
layout: whiskey
title: Aaron's Whiskey Ratings
permalink: /whiskey/
noindex: true
notranslate: true
nocache: true
---

<style>
:root{
  --bg:#0e130f;
  --panel:#171f19;
  --panel2:#1d281f;
  --line:#334237;
  --text:#f2f5f3;
  --muted:#a8b3ab;
  --green:#78a985;
  --green2:#9bc5a5;
  --amber:#c88a3d;
  --amber2:#e0ad65;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter",system-ui,-apple-system,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
.whiskey-app{max-width:1180px;margin:0 auto;padding:24px 22px 56px}

.hero{
  width:100%;
  aspect-ratio:1000/156;
  min-height:156px;
  border:1px solid #3b4a3f;
  border-radius:16px;
  margin-bottom:16px;
  overflow:hidden;
  background-image:url("/assets/whiskey/hero-banner.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  box-shadow:0 16px 45px rgba(0,0,0,.20);
}

.stats-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 16px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.stat-value{font-size:1.45rem;font-weight:700;color:#f5f8f6;line-height:1.1}
.stat-label{font-size:.78rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}

.nav-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.nav-row button{background:transparent;color:#d8dfda;border:1px solid #4b5b50;border-radius:999px;padding:7px 14px;cursor:pointer}
.nav-row button:hover{border-color:var(--green2)}
.nav-row button.active{background:var(--green);border-color:var(--green);color:#0e1710;font-weight:700}

.whiskey-controls{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.whiskey-controls input,.whiskey-controls select{background:#151b17;color:var(--text);border:1px solid #48584d;border-radius:9px;padding:9px 11px}
.whiskey-controls input{min-width:260px;flex:1}
.whiskey-panel{display:none}
.whiskey-panel.active{display:block}

.main-section,.chart-section{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);margin:0 0 18px}
.main-section h2,.chart-section h2{font-size:1.18rem;font-weight:650;margin:0;padding:13px 16px;background:var(--panel2);border-left:4px solid var(--green)}
.main-section .whiskey-table-wrap{border:0;border-radius:0}

.whiskey-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.whiskey-table{width:100%;border-collapse:collapse;margin:0;min-width:680px}
.main-section .whiskey-table{min-width:620px}
.whiskey-table th,.whiskey-table td{padding:10px 12px;border-bottom:1px solid #303d33;text-align:left;vertical-align:middle}
.whiskey-table tr:last-child td{border-bottom:0}
.whiskey-table th{background:#202a22;color:#f2f5f3;white-space:nowrap;font-weight:650}
.whiskey-table th.sortable{cursor:pointer;user-select:none}
.whiskey-table th.sortable:hover{background:#28352b}
.sort-arrow{display:inline-block;min-width:1em;margin-left:5px;color:#98a69c;font-size:.72em}
.whiskey-table td.num,.whiskey-table th.num{text-align:right;font-variant-numeric:tabular-nums}
.whiskey-table tr:hover td{background:#1d261f}
.detail-table th:first-child,.detail-table td:first-child{min-width:250px}
.detail-table th:nth-child(2),.detail-table td:nth-child(2){min-width:105px}
.detail-table th:nth-child(3),.detail-table td:nth-child(3){min-width:190px}
.whiskey-name,.filter-link{color:#eff5f0;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:#718178;cursor:pointer;background:none;border:0;padding:0;font:inherit;text-align:left}
.whiskey-name:hover,.filter-link:hover{color:#fff;text-decoration-color:var(--green2)}

.chart-body{padding:14px 16px 16px}
.bar-row{display:grid;grid-template-columns:minmax(150px,230px) 1fr 112px;gap:12px;align-items:center;margin:9px 0}
.bar-label{color:#e5ebe6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:14px;background:#263129;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green2));border-radius:999px;min-width:2px}
.bar-value{text-align:right;color:#d7dfd9;font-variant-numeric:tabular-nums;font-size:.9rem}
.bar-value .pct-range{color:var(--muted);font-size:.78rem;margin-left:5px}
.substyle-chart .bar-row{grid-template-columns:minmax(250px,34%) minmax(140px,1fr) 44px}
.substyle-chart .bar-label{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.2}
.substyle-more{padding:0 16px 15px}
.substyle-more button{background:transparent;color:#dce4de;border:1px solid #536258;border-radius:999px;padding:6px 11px;cursor:pointer}
.substyle-more button:hover{border-color:var(--green2)}

.history-table{min-width:1000px}
.history-table td,.history-table th{white-space:nowrap}
.history-table td:nth-child(2),.history-table th:nth-child(2){min-width:260px}
.history-table td:nth-child(4),.history-table th:nth-child(4){min-width:200px}

dialog.whiskey-dialog{background:#151b17;color:var(--text);border:1px solid #536258;border-radius:12px;max-width:650px;width:92%}
dialog.whiskey-dialog::backdrop{background:rgba(0,0,0,.7)}
.whiskey-dialog button.close{float:right;background:#202820;color:#fff;border:1px solid #5a695f;border-radius:6px;padding:6px 10px;cursor:pointer}
.whiskey-history-list{width:100%;border-collapse:collapse}
.whiskey-history-list td,.whiskey-history-list th{border-bottom:1px solid #344037;padding:8px}

@media(max-width:800px){
  .hero{min-height:130px;background-position:center}
  .stats-row{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:620px){
  .whiskey-app{padding:14px 10px 36px}
  .hero{min-height:108px;background-position:left center}
  .stats-row{gap:8px}
  .stat-card{padding:11px}
  .stat-value{font-size:1.25rem}
  .nav-row{gap:6px}
  .nav-row button{padding:6px 10px}
  .whiskey-controls{flex-direction:column}
  .whiskey-controls input{min-width:0}
  .bar-row{grid-template-columns:105px 1fr 90px;gap:8px}
  .substyle-chart .bar-row{grid-template-columns:minmax(170px,45%) 1fr 34px}
}
</style>

<div class="whiskey-app notranslate" translate="no">
  <header class="hero" role="img" aria-label="Aaron's Whiskey Ratings with whiskey glasses, bottle, and barrel"></header>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-value" id="stat-whiskeys">—</div><div class="stat-label">Whiskeys</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-ratings">—</div><div class="stat-label">Ratings</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-qualified">—</div><div class="stat-label">Qualified</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-average">—</div><div class="stat-label">Average / 5.0</div></div>
  </div>

  <nav class="nav-row" id="primary-tabs" aria-label="Whiskey views">
    <button class="active" data-tab="main">Main</button>
    <button data-tab="qualified">Qualified</button>
    <button data-tab="need-more">Need More</button>
    <button data-tab="history">History</button>
  </nav>

  <div class="whiskey-controls" id="whiskey-controls" style="display:none">
    <input id="search" type="search" placeholder="Search whiskey…">
    <select id="style-filter"><option value="">All styles</option></select>
    <select id="substyle-filter"><option value="">All sub-styles</option></select>
  </div>

  <div id="main" class="whiskey-panel active"></div>
  <div id="qualified" class="whiskey-panel"></div>
  <div id="need-more" class="whiskey-panel"></div>
  <div id="history" class="whiskey-panel"></div>
</div>

<dialog id="whiskey-dialog" class="whiskey-dialog">
  <button class="close" id="dialog-close">Close</button>
  <div id="dialog-content"></div>
</dialog>

<script>
(function(){
  var DATA_URL="/data/whiskey_ratings.json?v="+Date.now();
  var data=null,rows=[],activeTab="main",substyleExpanded=false;
  var sortState={
    qualified:{key:"average",dir:-1},
    "need-more":{key:"n",dir:-1},
    history:{key:"date",dir:-1}
  };
  var mainSort={
    recent:{key:"date",dir:-1},
    top:{key:"average",dir:-1},
    styles:{key:"whiskeys",dir:-1},
    most:{key:"n",dir:-1}
  };

  function avg(xs){return xs.reduce(function(a,b){return a+b},0)/xs.length}
  function fmt(x){return Number(x).toFixed(2)}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]})}
  function pctRank(values,x){
    if(values.length<=1)return 100;
    var below=values.filter(function(v){return v<x-1e-12}).length;
    return Math.round(100*below/(values.length-1));
  }
  function prettyDate(s){
    if(!s)return "—";
    return new Date(s+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
  }

  function computeRows(){
    rows=data.products.map(function(p){
      var scores=p.ratings.map(function(r){return r.score});
      return Object.assign({},p,{n:scores.length,average:avg(scores)});
    });
    var all=rows.map(function(r){return r.average});
    var qualified=rows.filter(function(r){return r.n>=3}).map(function(r){return r.average});
    var byStyle={};
    rows.forEach(function(r){(byStyle[r.style]||(byStyle[r.style]=[])).push(r.average)});
    rows=rows.map(function(r){
      return Object.assign({},r,{
        percentile:pctRank(all,r.average),
        qPercentile:r.n>=3?pctRank(qualified,r.average):null,
        sPercentile:pctRank(byStyle[r.style],r.average)
      });
    });
  }

  function setupFilters(){
    var styles=Array.from(new Set(rows.map(function(r){return r.style}))).sort();
    document.getElementById("style-filter").innerHTML='<option value="">All styles</option>'+
      styles.map(function(x){return '<option>'+esc(x)+'</option>'}).join("");
    updateSubstyles();
  }

  function updateSubstyles(){
    var style=document.getElementById("style-filter").value;
    var select=document.getElementById("substyle-filter");
    var current=select.value;
    var source=style?rows.filter(function(r){return r.style===style}):rows;
    var subs=Array.from(new Set(source.map(function(r){return r.substyle}))).sort();
    select.innerHTML='<option value="">All sub-styles</option>'+
      subs.map(function(x){return '<option>'+esc(x)+'</option>'}).join("");
    select.value=subs.indexOf(current)>=0?current:"";
  }

  function filtered(source){
    var q=document.getElementById("search").value.trim().toLowerCase();
    var style=document.getElementById("style-filter").value;
    var sub=document.getElementById("substyle-filter").value;
    return source.filter(function(r){
      return (!q||(r.name+" "+r.style+" "+r.substyle).toLowerCase().indexOf(q)>=0)&&
        (!style||r.style===style)&&(!sub||r.substyle===sub);
    });
  }

  function compare(a,b,key,dir){
    var av=a[key],bv=b[key];
    if(av==null&&bv==null)return 0;
    if(av==null)return 1;
    if(bv==null)return -1;
    if(typeof av==="string"&&typeof bv==="string")return dir*av.localeCompare(bv);
    return dir*(av-bv);
  }
  function sorted(state,items){
    return items.slice().sort(function(a,b){return compare(a,b,state.key,state.dir)});
  }

  function th(tab,key,label,cls){
    var s=sortState[tab];
    var arrow=s&&s.key===key?(s.dir===1?"▲":"▼"):"↕";
    return '<th class="sortable '+(cls||"")+'" data-tab="'+tab+'" data-sort="'+key+'">'+
      label+'<span class="sort-arrow">'+arrow+'</span></th>';
  }
  function mth(section,key,label,cls){
    var s=mainSort[section];
    var arrow=s.key===key?(s.dir===1?"▲":"▼"):"↕";
    return '<th class="sortable '+(cls||"")+'" data-main-section="'+section+'" data-main-sort="'+key+'">'+
      label+'<span class="sort-arrow">'+arrow+'</span></th>';
  }

  function whiskeyTable(source,tab){
    var xs=sorted(sortState[tab],source);
    var pctKey=tab==="qualified"?"qPercentile":"percentile";
    var pctLabel=tab==="qualified"?"Qualified %ile":"Overall %ile";
    var html='<div class="whiskey-table-wrap"><table class="whiskey-table detail-table"><thead><tr>'+
      th(tab,"name","Whiskey")+th(tab,"style","Style")+th(tab,"substyle","Sub-style")+
      th(tab,"n","N","num")+th(tab,"average","Avg","num")+th(tab,pctKey,pctLabel,"num")+
      '</tr></thead><tbody>';
    xs.forEach(function(r){
      var pct=r[pctKey];
      html+='<tr>'+
        '<td><button class="whiskey-name" data-name="'+esc(r.name)+'">'+esc(r.name)+'</button></td>'+
        '<td><button class="filter-link style-link" data-style="'+esc(r.style)+'">'+esc(r.style)+'</button></td>'+
        '<td>'+esc(r.substyle)+'</td>'+
        '<td class="num">'+r.n+'</td><td class="num">'+fmt(r.average)+'</td>'+
        '<td class="num">'+(pct==null?"—":pct)+'</td></tr>';
    });
    return html+'</tbody></table></div>';
  }

  function historyRows(){
    var out=[];
    rows.forEach(function(r){
      r.ratings.forEach(function(x){
        out.push({date:x.date||"",name:r.name,style:r.style,substyle:r.substyle,score:x.score});
      });
    });
    return out;
  }

  function historyTable(){
    var xs=sorted(sortState.history,historyRows());
    var html='<div class="whiskey-table-wrap"><table class="whiskey-table history-table"><thead><tr>'+
      th("history","date","Date")+th("history","name","Whiskey")+th("history","style","Style")+
      th("history","substyle","Sub-style")+th("history","score","Rating","num")+
      '</tr></thead><tbody>';
    xs.forEach(function(h){
      html+='<tr><td>'+prettyDate(h.date)+'</td>'+
        '<td><button class="whiskey-name" data-name="'+esc(h.name)+'">'+esc(h.name)+'</button></td>'+
        '<td>'+esc(h.style)+'</td><td>'+esc(h.substyle)+'</td>'+
        '<td class="num">'+h.score.toFixed(1)+'</td></tr>';
    });
    return html+'</tbody></table></div>';
  }

  function styleRows(){
    var groups={};
    rows.forEach(function(r){(groups[r.style]||(groups[r.style]=[])).push(r)});
    return Object.keys(groups).map(function(name){
      var rs=groups[name];
      return {name:name,whiskeys:rs.length,average:avg(rs.map(function(r){return r.average}))};
    });
  }

  function substyleRows(){
    var groups={};
    rows.forEach(function(r){(groups[r.substyle]||(groups[r.substyle]=[])).push(r)});
    return Object.keys(groups).map(function(name){
      var rs=groups[name];
      return {name:name,whiskeys:rs.length,average:avg(rs.map(function(r){return r.average}))};
    }).sort(function(a,b){return b.whiskeys-a.whiskeys||a.name.localeCompare(b.name)});
  }

  function mainRecent(){
    var xs=sorted(mainSort.recent,historyRows().filter(function(h){return h.date})).slice(0,10);
    var html='<div class="whiskey-table-wrap"><table class="whiskey-table"><thead><tr>'+
      mth("recent","date","Date")+mth("recent","name","Whiskey")+mth("recent","score","Rating","num")+mth("recent","style","Style")+
      '</tr></thead><tbody>';
    xs.forEach(function(h){
      html+='<tr><td style="white-space:nowrap">'+prettyDate(h.date)+'</td>'+
        '<td><button class="whiskey-name" data-name="'+esc(h.name)+'">'+esc(h.name)+'</button></td>'+
        '<td class="num">'+h.score.toFixed(1)+'</td><td>'+esc(h.style)+'</td></tr>';
    });
    return html+'</tbody></table></div>';
  }

  function mainTopRated(){
    var source=rows.filter(function(r){return r.n>=3});
    var xs=sorted(mainSort.top,source).slice(0,10);
    var html='<div class="whiskey-table-wrap"><table class="whiskey-table"><thead><tr>'+
      mth("top","name","Whiskey")+mth("top","average","Avg","num")+mth("top","n","N","num")+
      mth("top","qPercentile","Qualified %ile","num")+mth("top","style","Style")+
      '</tr></thead><tbody>';
    xs.forEach(function(r){
      html+='<tr><td><button class="whiskey-name" data-name="'+esc(r.name)+'">'+esc(r.name)+'</button></td>'+
        '<td class="num">'+fmt(r.average)+'</td><td class="num">'+r.n+'</td>'+
        '<td class="num">'+r.qPercentile+'</td><td>'+esc(r.style)+'</td></tr>';
    });
    return html+'</tbody></table></div>';
  }

  function mainStyles(){
    var xs=sorted(mainSort.styles,styleRows());
    var html='<div class="whiskey-table-wrap"><table class="whiskey-table"><thead><tr>'+
      mth("styles","name","Style")+mth("styles","whiskeys","Whiskeys","num")+mth("styles","average","Avg","num")+
      '</tr></thead><tbody>';
    xs.forEach(function(s){
      html+='<tr><td><button class="filter-link style-link" data-style="'+esc(s.name)+'">'+esc(s.name)+'</button></td>'+
        '<td class="num">'+s.whiskeys+'</td><td class="num">'+fmt(s.average)+'</td></tr>';
    });
    return html+'</tbody></table></div>';
  }

  function mainMostRated(){
    var xs=sorted(mainSort.most,rows).slice(0,10);
    var html='<div class="whiskey-table-wrap"><table class="whiskey-table"><thead><tr>'+
      mth("most","name","Whiskey")+mth("most","n","N","num")+mth("most","average","Avg","num")+mth("most","style","Style")+
      '</tr></thead><tbody>';
    xs.forEach(function(r){
      html+='<tr><td><button class="whiskey-name" data-name="'+esc(r.name)+'">'+esc(r.name)+'</button></td>'+
        '<td class="num">'+r.n+'</td><td class="num">'+fmt(r.average)+'</td><td>'+esc(r.style)+'</td></tr>';
    });
    return html+'</tbody></table></div>';
  }

  function barChart(items,labelKey,valueKey){
    var max=Math.max.apply(null,items.map(function(x){return x[valueKey]}));
    return '<div class="chart-body">'+items.map(function(x){
      var w=max?100*x[valueKey]/max:0;
      return '<div class="bar-row"><div class="bar-label" title="'+esc(x[labelKey])+'">'+esc(x[labelKey])+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+w.toFixed(1)+'%"></div></div>'+
        '<div class="bar-value">'+x[valueKey]+'</div></div>';
    }).join("")+'</div>';
  }

  function substyleChart(items){
    var shown=substyleExpanded?items:items.slice(0,12);
    var max=Math.max.apply(null,items.map(function(x){return x.whiskeys}));
    var body='<div class="chart-body substyle-chart">'+shown.map(function(x){
      var w=max?100*x.whiskeys/max:0;
      return '<div class="bar-row"><div class="bar-label">'+esc(x.name)+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+w.toFixed(1)+'%"></div></div>'+
        '<div class="bar-value">'+x.whiskeys+'</div></div>';
    }).join("")+'</div>';
    if(items.length>12){
      body+='<div class="substyle-more"><button type="button" id="substyle-toggle">'+
        (substyleExpanded?"Show fewer":"Show all "+items.length+" sub-styles")+'</button></div>';
    }
    return body;
  }

  function ratingDistribution(){
    var scores=[];
    rows.forEach(function(r){r.ratings.forEach(function(x){scores.push(Math.round(x.score*10))})});
    scores.sort(function(a,b){return a-b});
    var minScore=Math.min.apply(null,scores);
    var maxScore=Math.max.apply(null,scores);
    var start=Math.floor(minScore/2)*2;
    var bins=[];
    var total=scores.length;
    var cumulative=0;
    for(var lo=start;lo<=maxScore;lo+=2){
      var hi=lo+1;
      var count=scores.filter(function(s){return s>=lo&&s<=hi}).length;
      var pLow=Math.round(100*cumulative/total);
      cumulative+=count;
      var pHigh=Math.round(100*cumulative/total);
      bins.push({
        label:(lo/10).toFixed(1)+"–"+(hi/10).toFixed(1),
        count:count,
        pct:"P"+pLow+"–P"+pHigh
      });
    }
    var max=Math.max.apply(null,bins.map(function(x){return x.count}));
    return '<div class="chart-body">'+bins.map(function(x){
      var w=max?100*x.count/max:0;
      return '<div class="bar-row"><div class="bar-label">'+x.label+'</div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+w.toFixed(1)+'%"></div></div>'+
        '<div class="bar-value">'+x.count+'<span class="pct-range">'+x.pct+'</span></div></div>';
    }).join("")+'</div>';
  }

  function renderMain(){
    document.getElementById("whiskey-controls").style.display="none";
    var styles=styleRows().sort(function(a,b){return b.whiskeys-a.whiskeys||a.name.localeCompare(b.name)});
    var substyles=substyleRows();
    document.getElementById("main").innerHTML=
      '<section class="main-section"><h2>Recent Ratings</h2>'+mainRecent()+'</section>'+
      '<section class="main-section"><h2>Top Rated Whiskeys</h2>'+mainTopRated()+'</section>'+
      '<section class="main-section"><h2>By Style</h2>'+mainStyles()+'</section>'+
      '<section class="chart-section"><h2>Whiskeys by Style</h2>'+barChart(styles,"name","whiskeys")+'</section>'+
      '<section class="chart-section"><h2>Whiskeys by Sub-style</h2>'+substyleChart(substyles)+'</section>'+
      '<section class="main-section"><h2>Most Rated Whiskeys</h2>'+mainMostRated()+'</section>'+
      '<section class="chart-section"><h2>Rating Distribution</h2>'+ratingDistribution()+'</section>';
  }

  function render(){
    if(activeTab==="main"){
      renderMain();
    }else if(activeTab==="qualified"){
      document.getElementById("whiskey-controls").style.display="flex";
      document.getElementById("qualified").innerHTML=whiskeyTable(filtered(rows.filter(function(r){return r.n>=3})),"qualified");
    }else if(activeTab==="need-more"){
      document.getElementById("whiskey-controls").style.display="flex";
      document.getElementById("need-more").innerHTML=whiskeyTable(filtered(rows.filter(function(r){return r.n<3})),"need-more");
    }else{
      document.getElementById("whiskey-controls").style.display="none";
      document.getElementById("history").innerHTML=historyTable();
    }
    bindEvents();
  }

  function switchPrimary(tab){
    activeTab=tab;
    document.querySelectorAll("#primary-tabs button").forEach(function(b){
      b.classList.toggle("active",b.getAttribute("data-tab")===tab);
    });
    document.querySelectorAll(".whiskey-panel").forEach(function(p){
      p.classList.toggle("active",p.id===tab);
    });
    render();
  }

  function drillStyle(style){
    activeTab="qualified";
    document.getElementById("style-filter").value=style;
    updateSubstyles();
    document.getElementById("substyle-filter").value="";
    document.getElementById("search").value="";
    document.querySelectorAll("#primary-tabs button").forEach(function(b){
      b.classList.toggle("active",b.getAttribute("data-tab")==="qualified");
    });
    document.querySelectorAll(".whiskey-panel").forEach(function(p){
      p.classList.toggle("active",p.id==="qualified");
    });
    render();
  }

  function bindEvents(){
    document.querySelectorAll(".sortable[data-tab]").forEach(function(cell){
      cell.onclick=function(){
        var tab=cell.getAttribute("data-tab"),key=cell.getAttribute("data-sort"),s=sortState[tab];
        if(s.key===key)s.dir*=-1;
        else{s.key=key;s.dir=["name","style","substyle","date"].indexOf(key)>=0?1:-1}
        render();
      };
    });
    document.querySelectorAll(".sortable[data-main-section]").forEach(function(cell){
      cell.onclick=function(){
        var section=cell.getAttribute("data-main-section"),key=cell.getAttribute("data-main-sort"),s=mainSort[section];
        if(s.key===key)s.dir*=-1;
        else{s.key=key;s.dir=["name","style","date"].indexOf(key)>=0?1:-1}
        render();
      };
    });
    document.querySelectorAll(".whiskey-name").forEach(function(btn){
      btn.onclick=function(){showDetail(btn.getAttribute("data-name"))};
    });
    document.querySelectorAll(".style-link").forEach(function(btn){
      btn.onclick=function(){drillStyle(btn.getAttribute("data-style"))};
    });
    var subToggle=document.getElementById("substyle-toggle");
    if(subToggle)subToggle.onclick=function(){
      substyleExpanded=!substyleExpanded;
      render();
    };
  }

  function showDetail(name){
    var r=rows.find(function(x){return x.name===name});
    if(!r)return;
    var hist=r.ratings.map(function(x,i){
      return '<tr><td>'+(i+1)+'</td><td>'+prettyDate(x.date)+'</td><td>'+x.score.toFixed(1)+'</td></tr>';
    }).join("");
    document.getElementById("dialog-content").innerHTML=
      '<h2>'+esc(r.name)+'</h2>'+
      '<p>'+esc(r.style)+' · '+esc(r.substyle)+'</p>'+
      '<p><strong>Avg:</strong> '+fmt(r.average)+' / 5.0 &nbsp; <strong>N:</strong> '+r.n+
      ' &nbsp; <strong>Overall %ile:</strong> '+r.percentile+
      ' &nbsp; <strong>Qualified %ile:</strong> '+(r.qPercentile==null?"—":r.qPercentile)+
      ' &nbsp; <strong>Style %ile:</strong> '+r.sPercentile+'</p>'+
      '<table class="whiskey-history-list"><thead><tr><th>#</th><th>Date</th><th>Rating</th></tr></thead><tbody>'+hist+'</tbody></table>';
    document.getElementById("whiskey-dialog").showModal();
  }

  function init(){
    fetch(DATA_URL,{cache:"no-store"}).then(function(res){return res.json()}).then(function(json){
      data=json;
      computeRows();
      setupFilters();

      var totalRatings=rows.reduce(function(a,r){return a+r.n},0);
      var scores=[];
      rows.forEach(function(r){r.ratings.forEach(function(x){scores.push(x.score)})});
      var qualified=rows.filter(function(r){return r.n>=3}).length;
      document.getElementById("stat-whiskeys").textContent=rows.length;
      document.getElementById("stat-ratings").textContent=totalRatings;
      document.getElementById("stat-qualified").textContent=qualified;
      document.getElementById("stat-average").textContent=fmt(avg(scores));

      document.querySelectorAll("#primary-tabs button").forEach(function(btn){
        btn.onclick=function(){switchPrimary(btn.getAttribute("data-tab"))};
      });
      document.getElementById("search").addEventListener("input",render);
      document.getElementById("style-filter").addEventListener("change",function(){updateSubstyles();render()});
      document.getElementById("substyle-filter").addEventListener("change",render);
      document.getElementById("dialog-close").onclick=function(){document.getElementById("whiskey-dialog").close()};
      render();
    }).catch(function(err){
      document.getElementById("main").innerHTML="<p>Could not load whiskey data.</p>";
      console.error(err);
    });
  }
  init();
})();
</script>
